name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, unit + property tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Production build (with the repo's Pages base path)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: npm run check:prod-bundle

  e2e:
    name: End-to-end (Chromium + WebKit)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  chaos:
    # CHAOS_TESTING.md §9: the UI monkey (500 steps per engine), storage and lifecycle fault
    # scenarios, and the production smoke run. Any failure blocks the merge. A failure prints
    # CHAOS_SEED=<n>; replay locally with `CHAOS_SEED=<n> npm run chaos`.
    name: Chaos (monkey, faults, production smoke)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run chaos
        env:
          CHAOS_STEPS: 500
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chaos-artifacts
          path: |
            tests/chaos/artifacts/
            test-results/
          retention-days: 14

  arranger:
    # DEVELOPMENT.md §9 phase-3 exit: the arranger is legal for 10,000 random melodies.
    name: Arranger property test (10,000 melodies)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/property/arranger.property.test.ts
        env:
          ARRANGER_RUNS: 10000

  spike-s0:
    # Spike S0: does Web Audio / service worker / offline work in Playwright WebKit?
    # Findings, not a gate: read the [S0] lines in the log. Windows result is recorded in
    # CHAOS_TESTING.md §9 (no Web Audio in WebKit); Linux decides whether CI covers (W) rows.
    name: Spike S0 (${{ matrix.os }}, informational)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    needs: verify
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium webkit
      - run: npm run spike:s0
